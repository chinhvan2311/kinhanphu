<!DOCTYPE html>

<head>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <div class="hvisual"><div class="arch"><img data-img="ledOval" alt=""></div>
      <div class="hfloat f1"><i data-ic="drop"></i><span data-i18n="hb.1"></span></div><div class="hfloat f2"><i data-ic="sun"></i><span data-i18n="hb.2"></span></div></div>
  </div></div>

  <div class="hslide"><div class="hgrid">
    <div class="htext"><span class="eyebrow" data-i18n="h2.k"></span><h2 data-i18n="h2.t"></h2><p data-i18n="h2.d"></p>
      <div class="hbtn"><a class="btn btn-gold" href="contact.html"><span data-i18n="btn.quote"></span><i data-ic="arrow"></i></a><a class="btn btn-ghost" href="products.html"><span data-i18n="btn.explore"></span></a></div></div>
    <div class="hvisual"><div class="arch"><img data-img="fbArch" alt=""></div>
      <div class="hfloat f1"><i data-ic="shield"></i><span data-i18n="hb.4"></span></div><div class="hfloat f2"><i data-ic="award"></i><span data-i18n="hb.3"></span></div></div>
  </div></div>

  <div class="hslide"><div class="hgrid">
    <div class="htext"><span class="eyebrow" data-i18n="h3.k"></span><h2 data-i18n="h3.t"></h2><p data-i18n="h3.d"></p>
      <div class="hbtn"><a class="btn btn-gold" href="contact.html"><span data-i18n="btn.quote"></span><i data-ic="arrow"></i></a><a class="btn btn-ghost" href="cnc-service.html"><span data-i18n="cb.btn"></span></a></div></div>

  <div class="hctrl"><button class="harrow" id="hPrev" type="button" aria-label="Prev"><i data-ic="chevL"></i></button><div class="hdots"></div><button class="harrow" id="hNext" type="button" aria-label="Next"><i data-ic="chevR"></i></button></div>
</section>

<section class="trust"><div class="container"><div class="trust-grid">
  <div class="trust-item"><span class="ico"><i data-ic="factory"></i></span><div><b data-i18n="tr1.t"></b><p data-i18n="tr1.d"></p></div></div>
  <div class="trust-item"><span class="ico"><i data-ic="shield"></i></span><div><b data-i18n="tr2.t"></b><p data-i18n="tr2.d"></p></div></div>
  <div class="trust-item"><span class="ico"><i data-ic="ruler"></i></span><div><b data-i18n="tr3.t"></b><p data-i18n="tr3.d"></p></div></div>
  <div class="trust-item"><span class="ico"><i data-ic="truck"></i></span><div><b data-i18n="tr4.t"></b><p data-i18n="tr4.d"></p></div></div>
</div></div></section>

<section class="section"><div class="container">
  <div class="sec-head reveal"><span class="eyebrow" data-i18n="sec.cat.k"></span><h2 data-i18n="sec.cat.t"></h2><p data-i18n="sec.cat.d"></p></div>
  <div class="cat-grid" id="catGrid"></div>
</div></section>

<section class="section alt"><div class="container">
  <div class="sec-head reveal"><span class="eyebrow" data-i18n="sec.feat.k"></span><h2 data-i18n="sec.feat.t"></h2><p data-i18n="sec.feat.d"></p></div>
  <div class="tabs" id="featTabs"></div>

</div></section>

<section class="section"><div class="container split">
  <div class="split-img reveal left"><div class="main"><img data-img="cnc2" alt=""></div><div class="float-card"><i data-ic="factory"></i><span data-i18n="ab.badge"></span></div></div>
  <div class="reveal right"><span class="eyebrow" data-i18n="sec.about.k"></span><h2 data-i18n="sec.about.t"></h2><p style="color:var(--muted)" data-i18n="sec.about.d"></p>
    <ul class="checklist" style="margin:1.2rem 0 1.8rem">
      <li><i data-ic="check"></i><span data-i18n="ab.1"></span></li><li><i data-ic="check"></i><span data-i18n="ab.2"></span></li>
      <li><i data-ic="check"></i><span data-i18n="ab.3"></span></li><li><i data-ic="check"></i><span data-i18n="ab.4"></span></li></ul>
    <a class="btn btn-dark" href="about.html"><span data-i18n="nav.about"></span><i data-ic="arrow"></i></a></div>
</div></section>

<section class="section dark"><div class="container"><div class="stats">
  <div class="stat reveal"><b data-count="15" data-suffix="+">0</b><span data-i18n="st.1"></span></div>
  <div class="stat reveal" data-d="100"><b data-count="1200" data-suffix="+">0</b><span data-i18n="st.2"></span></div>
  <div class="stat reveal" data-d="200"><b data-count="500" data-suffix="+">0</b><span data-i18n="st.3"></span></div>
  <div class="stat reveal" data-d="300"><b data-count="98" data-suffix="%">0</b><span data-i18n="st.4"></span></div>
</div></div></section>

<section class="section"><div class="container">
  <div class="sec-head reveal"><span class="eyebrow" data-i18n="sec.proc.k"></span><h2 data-i18n="sec.proc.t"></h2><p data-i18n="sec.proc.d"></p></div>
  <div class="steps" id="steps"></div>
</div></section>

<section class="banner"><div class="bg"><img data-img="cnc3" alt=""></div><div class="container reveal">
  <span class="eyebrow" data-i18n="cb.k"></span><h2 data-i18n="cb.t"></h2><p data-i18n="cb.d"></p>
  <a class="btn btn-gold" href="cnc-service.html" style="margin-top:1rem"><span data-i18n="cb.btn"></span><i data-ic="arrow"></i></a>
</div></section>

<section class="section"><div class="container">
  <div class="sec-head reveal"><span class="eyebrow" data-i18n="sec.prj.k"></span><h2 data-i18n="sec.prj.t"></h2><p data-i18n="sec.prj.d"></p></div>

</div></section>

<section class="section dark"><div class="container">
  <div class="sec-head reveal"><span class="eyebrow" data-i18n="sec.tm.k"></span><h2 data-i18n="sec.tm.t"></h2></div>
  <div class="tm-wrap" id="tmWrap"></div><div class="tm-dots" id="tmDots"></div>
</div></section>

<div class="marquee"><div class="mq-cap" data-i18n="partners"></div><div class="mq-track" id="mqTrack"></div></div>

<section class="section"><div class="container">
  <div class="sec-head reveal"><span class="eyebrow" data-i18n="sec.news.k"></span><h2 data-i18n="sec.news.t"></h2><p data-i18n="sec.news.d"></p></div>
  <div class="news-grid" id="newsGrid"></div>
</div></section>

<section class="section cta"><div class="container cta-in">
  <div class="reveal left"><h2 data-i18n="cta.t"></h2><p data-i18n="cta.d"></p>
    <p style="font-weight:700"><i data-ic="phone"></i> (+84) 93 874 8979 &nbsp; <i data-ic="mail"></i> kinhhopphongsach@gmail.com</p></div>
  <div class="reveal right"><form class="qform js-form" novalidate>
  <div class="fgrid">
    <div><label class="f" for="n1" data-i18n="f.name"></label><input class="inp" id="n1" name="name" autocomplete="name"></div>
    <div><label class="f" for="p1" data-i18n="f.phone"></label><input class="inp" id="p1" name="phone" inputmode="tel" autocomplete="tel"></div>
    <div><label class="f" for="e1" data-i18n="f.email"></label><input class="inp" id="e1" name="email" type="email" autocomplete="email"></div>
    <div><label class="f" for="t1" data-i18n="f.type"></label><select class="inp" id="t1" name="type"><option data-i18n="f.t1"></option><option data-i18n="f.t2"></option><option data-i18n="f.t3"></option><option data-i18n="f.t4"></option></select></div>
    <div class="full"><label class="f" for="m1" data-i18n="f.msg"></label><textarea class="inp" id="m1" name="msg" data-i18n-ph="f.msg.ph"></textarea></div>
    <div class="full"><button class="btn btn-dark" type="submit"><span data-i18n="btn.send"></span><i data-ic="send"></i></button></div>
  </div><div class="form-result"></div></form></div>
</div></section>
