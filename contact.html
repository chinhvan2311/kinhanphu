<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>An Phú Mirror</title>
<meta name="description" content="Nhà sản xuất gương LED, gương nhà tắm, gương toàn thân, gương trang trí và gia công cắt kính CNC.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
<div id="site-header"></div>
<main>
<section class="pbanner"><div class="container">
  <div class="crumbs"><a href="index.html" data-i18n="nav.home"></a><span>/</span><span data-i18n="pg.contact"></span></div>
  <h1 id="pbTitle" data-i18n="pg.contact"></h1><p data-i18n="pg.contact.d"></p>
</div></section>

<section class="section" style="padding-top:48px"><div class="container" style="display:grid;grid-template-columns:1.1fr .9fr;gap:2.4rem" id="ctWrap">
  <div><h3 data-i18n="ct.t"></h3><div class="infocards" id="ctCards"></div><div class="map" id="mapBox" style="margin-top:1.2rem"></div></div>
  <form class="qform js-form" novalidate style="box-shadow:var(--shadow);border:1px solid var(--line);align-self:start">
    <div class="fgrid">
      <div><label class="f" for="cn" data-i18n="f.name"></label><input class="inp" id="cn" name="name" autocomplete="name"></div>
      <div><label class="f" for="cp" data-i18n="f.phone"></label><input class="inp" id="cp" name="phone" inputmode="tel" autocomplete="tel"></div>
      <div><label class="f" for="ce" data-i18n="f.email"></label><input class="inp" id="ce" name="email" type="email"></div>
      <div><label class="f" for="cc" data-i18n="f.company"></label><input class="inp" id="cc" name="company"></div>
      <div class="full"><label class="f" for="cType" data-i18n="f.type"></label><select class="inp" id="cType" name="type"><option value="product" data-i18n="f.t1"></option><option value="cnc" data-i18n="f.t2"></option><option value="project" data-i18n="f.t3"></option><option value="other" data-i18n="f.t4"></option></select></div>
      <div class="full"><label class="f" for="cMsg" data-i18n="f.msg"></label><textarea class="inp" id="cMsg" name="msg" data-i18n-ph="f.msg.ph" style="min-height:150px"></textarea></div>
      <div class="full"><button class="btn btn-gold" type="submit"><span data-i18n="btn.send"></span><i data-ic="send"></i></button></div>
    </div><div class="form-result"></div></form>
</div></section>
<section class="section alt"><div class="container"><div class="sec-head"><h2 data-i18n="faq.t"></h2></div><div class="faq"><div class="acc reveal"><button type="button"><span data-i18n="q1"></span><i data-ic="plus"></i></button><div class="ans"><p data-i18n="a1"></p></div></div><div class="acc reveal"><button type="button"><span data-i18n="q2"></span><i data-ic="plus"></i></button><div class="ans"><p data-i18n="a2"></p></div></div><div class="acc reveal"><button type="button"><span data-i18n="q3"></span><i data-ic="plus"></i></button><div class="ans"><p data-i18n="a3"></p></div></div><div class="acc reveal"><button type="button"><span data-i18n="q4"></span><i data-ic="plus"></i></button><div class="ans"><p data-i18n="a4"></p></div></div></div></div></section>
<style>@media(max-width:900px){#ctWrap{grid-template-columns:1fr!important}}</style>

</main>
<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/main.js"></script>
</body>
</html>
