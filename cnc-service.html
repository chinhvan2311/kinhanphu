<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>An Phú Mirror</title>
<meta name="description" content="Nhà sản xuất gương LED, gương nhà tắm, gương toàn thân, gương trang trí và gia công cắt kính CNC.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="cnc">
<div id="site-header"></div>
<main>
<section class="pbanner"><div class="container">
  <div class="crumbs"><a href="index.html" data-i18n="nav.home"></a><span>/</span><span data-i18n="pg.cnc"></span></div>
  <h1 id="pbTitle" data-i18n="pg.cnc"></h1><p data-i18n="pg.cnc.d"></p>
</div></section>

<section class="section"><div class="container">
  <div class="sec-head reveal"><span class="eyebrow" data-i18n="cnc.s.k"></span><h2 data-i18n="cnc.s.t"></h2></div>
  <div class="svc-grid"><div class="svc reveal" data-d="0"><div class="ico"><i data-ic="cut"></i></div><h3 data-i18n="cs1.t"></h3><p data-i18n="cs1.d"></p></div><div class="svc reveal" data-d="70"><div class="ico"><i data-ic="layers"></i></div><h3 data-i18n="cs2.t"></h3><p data-i18n="cs2.d"></p></div><div class="svc reveal" data-d="140"><div class="ico"><i data-ic="sun"></i></div><h3 data-i18n="cs3.t"></h3><p data-i18n="cs3.d"></p></div><div class="svc reveal" data-d="210"><div class="ico"><i data-ic="ruler"></i></div><h3 data-i18n="cs4.t"></h3><p data-i18n="cs4.d"></p></div><div class="svc reveal" data-d="280"><div class="ico"><i data-ic="drop"></i></div><h3 data-i18n="cs5.t"></h3><p data-i18n="cs5.d"></p></div><div class="svc reveal" data-d="350"><div class="ico"><i data-ic="bolt"></i></div><h3 data-i18n="cs6.t"></h3><p data-i18n="cs6.d"></p></div></div>
</div></section>

<section class="section alt"><div class="container">
  <div class="sec-head reveal"><span class="eyebrow" data-i18n="cfg.k"></span><h2 data-i18n="cfg.t"></h2><p data-i18n="cfg.d"></p></div>
  <div class="cfg reveal zoom">
    <div class="cfg-stage"><div class="cfg-mirror" id="cfgMirror"></div><div class="cfg-dim" id="cfgDim"></div></div>
    <div class="cfg-form">
      <div class="blk"><label class="f" data-i18n="cfg.shape"></label><div class="chips" id="shapeBtns"></div></div>
      <div class="blk"><label class="f"><span data-i18n="cfg.w"></span>: <b id="wv"></b></label><input class="range" id="rw" type="range" min="30" max="120" value="60"></div>
      <div class="blk"><label class="f"><span data-i18n="cfg.h"></span>: <b id="hv"></b></label><input class="range" id="rh" type="range" min="30" max="200" value="90"></div>
      <div class="blk"><label class="f" data-i18n="cfg.edge"></label><div class="chips" id="edgeBtns"></div></div>
      <div class="blk"><label class="f" data-i18n="cfg.thick"></label><div class="chips" id="thickBtns"></div></div>
      <div class="blk" style="display:flex;gap:.8rem;align-items:center"><label class="switch"><input type="checkbox" id="cfgLed"><i></i></label><b data-i18n="cfg.led"></b></div>
      <div class="cfg-out"><span><span data-i18n="cfg.area"></span>: <b id="cfgArea"></b></span><span id="cfgTh"></span></div>
      <a class="btn btn-gold" id="cfgGo" href="contact.html"><span data-i18n="cfg.go"></span><i data-ic="arrow"></i></a>
      <p class="hint" data-i18n="cfg.note"></p>
    </div>
  </div>
</div></section>

<section class="section"><div class="container">
  <div class="sec-head reveal"><h2 data-i18n="cnc.p.t"></h2></div><div class="steps" id="steps"></div>
</div></section>

<section class="section alt"><div class="container" style="max-width:860px">
  <div class="sec-head reveal"><h2 data-i18n="cnc.cap.t"></h2></div>
  <table class="cap reveal"><tr><td data-i18n="cap.1"></td><td data-i18n="cap.1v"></td></tr><tr><td data-i18n="cap.2"></td><td data-i18n="cap.2v"></td></tr><tr><td data-i18n="cap.3"></td><td data-i18n="cap.3v"></td></tr><tr><td data-i18n="cap.4"></td><td data-i18n="cap.4v"></td></tr><tr><td data-i18n="cap.5"></td><td data-i18n="cap.5v"></td></tr></table><p class="hint" data-i18n="cap.note"></p>
</div></section>

<section class="section"><div class="container"><div class="sec-head reveal"><h2 data-i18n="faq.t"></h2></div><div class="faq"><div class="acc reveal"><button type="button"><span data-i18n="q1"></span><i data-ic="plus"></i></button><div class="ans"><p data-i18n="a1"></p></div></div><div class="acc reveal"><button type="button"><span data-i18n="q2"></span><i data-ic="plus"></i></button><div class="ans"><p data-i18n="a2"></p></div></div><div class="acc reveal"><button type="button"><span data-i18n="q3"></span><i data-ic="plus"></i></button><div class="ans"><p data-i18n="a3"></p></div></div><div class="acc reveal"><button type="button"><span data-i18n="q4"></span><i data-ic="plus"></i></button><div class="ans"><p data-i18n="a4"></p></div></div></div></div></section>

<section class="banner"><div class="bg"><img data-img="cnc4" alt=""></div><div class="container reveal"><span class="eyebrow" data-i18n="cb.k"></span><h2 data-i18n="cta.t"></h2><p data-i18n="cta.d"></p><a class="btn btn-gold" href="contact.html?service=cnc" style="margin-top:1rem"><span data-i18n="btn.quote"></span><i data-ic="arrow"></i></a></div></section>

</main>
<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/main.js"></script>
</body>
</html>
